name: Check version bump

on:
  pull_request:
    branches:
      - main

jobs:
  check-version:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR version
        id: pr
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Get main version
        id: main
        run: |
          git show origin/main:package.json > /tmp/main-package.json
          echo "version=$(node -p "require('/tmp/main-package.json').version")" >> $GITHUB_OUTPUT

      - name: Validate version was bumped
        run: |
          PR="${{ steps.pr.outputs.version }}"
          MAIN="${{ steps.main.outputs.version }}"
          if [ "$PR" = "$MAIN" ]; then
            echo "Version not bumped. Still at $MAIN — update package.json following semver (https://semver.org)"
            exit 1
          fi
          echo "Version bumped: $MAIN → $PR"
